[package]
name = "catatagen-local"
version = "1.0.0"
description = "CatatAgen Local - Tauri WebView Shell for Express.js backend"
authors = ["herdianrony"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "catatagen_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
